  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f0f8ff;
      color: #333;
    }
    input, select, textarea, button {
      font-size: 16px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      border: 1px solid #4169e1;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #4169e1;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #1e90ff;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
      color: #4169e1;
      font-size: 1.2em;
      background-color: #e6f2ff;
      padding: 15px;
      border-radius: 4px;
    }
    #money {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
      color: #008000;
      font-size: 1.1em;
    }
    #notice {
      background-color: #e6f2ff;
      padding: 10px;
      border-radius: 4px;
      margin-top: 20px;
    }
    .error {
      color: red;
      font-weight: bold;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      padding: 5px;
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .delete-btn {
      background-color: red;
      color: white;
      border: none;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 16px;
      line-height: 24px;
      text-align: center;
      padding: 0;
      border-radius: 3px;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
        line-height: 1.2;
      }
    }
  </style>
</head>
<body>
  <h1>星4かけら計算サイト</h1>

  <div class="form-group">
    <label for="current">現在のかけら数:</label>
    <input type="number" id="current" min="0" max="240">
  </div>

  <div class="form-group">
    <label for="goal">目標のかけら数 (最大240):</label>
    <input type="number" id="goal" min="1" max="240">
  </div>

  <div class="form-group">
    <label for="daily">毎日もらえるかけらの数:</label>
    <input type="number" id="daily" min="0">
  </div>

  <div class="form-group">
    <label for="weekly">毎週もらえるかけらの数:</label>
    <input type="number" id="weekly" min="0">
  </div>

  <div class="form-group">
    <label for="biweekly">隔週でもらえるかけらの数:</label>
    <input type="number" id="biweekly" min="0">
  </div>

  <div class="form-group">
    <label for="chargebattle">チャレバト課金をしている:</label>
    <select id="chargebattle">
      <option value="no">いいえ</option>
      <option value="yes">はい</option>
    </select>
  </div>

  <div class="form-group">
    <label for="training">特訓課金をしている:</label>
    <select id="training">
      <option value="no">いいえ</option>
      <option value="yes">はい</option>
    </select>
  </div>

  <button onclick="calculate()">計算</button>

  <div id="result"></div>
  <div id="money"></div>

  <script>
    function calculate() {
      const current = Number(document.getElementById("current").value);
      const goal = Number(document.getElementById("goal").value);
      const daily = Number(document.getElementById("daily").value);
      const weekly = Number(document.getElementById("weekly").value);
      const biweekly = Number(document.getElementById("biweekly").value);
      const chargebattle = document.getElementById("chargebattle").value;
      const training = document.getElementById("training").value;

      if (goal > 240 || current < 0 || goal <= current) {
        document.getElementById("result").innerText = "正しいかけら数を入力してください。";
        document.getElementById("money").innerText = "";
        return;
      }

      let needed = goal - current;
      let day = 0;

      while (needed > 0 && day < 3650) {
        let plus = daily;
        if (day % 7 === 0) plus += weekly;
        if (day % 14 === 0) plus += biweekly;
        needed -= plus;
        day++;
      }

      const now = new Date();
      now.setDate(now.getDate() + day);
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');

      document.getElementById("result").innerText = `目標達成予定日: ${yyyy}/${mm}/${dd}`;

      let chargeTotal = 0;
      if (chargebattle === "yes") {
        chargeTotal += Math.ceil(day / 7) * 480;
      }
      if (training === "yes") {
        chargeTotal += Math.ceil(day / 14) * 800;
      }

      if (chargeTotal > 0) {
        document.getElementById("money").innerText = `予定課金額: ${chargeTotal.toLocaleString()}円`;
      } else {
        document.getElementById("money").innerText = "";
      }
    }
  </script>
</body>
